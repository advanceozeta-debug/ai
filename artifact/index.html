<title>나만의 AI 비서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a narrow rail of personas and memory beside one reading column of conversation; rail folds into a top bar on phones. */
  :root {
    --bg: #f3f5f4; --panel: #ffffff; --fg: #18211f; --muted: #5f6b68; --line: #dce2e0;
    --accent: #1d6b62; --accent-ink: #ffffff; --accent-soft: #e2efec; --user: #e6ebe9; --code: #eef2f1; --danger: #b3261e;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #121716; --panel: #1a2120; --fg: #e5ebe9; --muted: #96a3a0; --line: #2b3533;
    --accent: #5bbfb0; --accent-ink: #0d1413; --accent-soft: #1f3330; --user: #243030; --code: #0f1413; --danger: #f2a49d; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #121716; --panel: #1a2120; --fg: #e5ebe9; --muted: #96a3a0; --line: #2b3533;
    --accent: #5bbfb0; --accent-ink: #0d1413; --accent-soft: #1f3330; --user: #243030; --code: #0f1413; --danger: #f2a49d; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.65 var(--font-body); display: flex; overflow: hidden; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .rail { width: 272px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); padding: 22px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 24px; overflow-y: auto; box-sizing: border-box; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .mode { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .mode.on::before { background: var(--accent); }
  .label { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .personas { display: grid; gap: 6px; }
  .persona { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 11px; }
  .persona:hover { background: var(--accent-soft); }
  .persona b { display: block; font-weight: 500; }
  .persona span { display: block; font-size: 12.5px; color: var(--muted); }
  .persona[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .memory { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .memory li { display: flex; gap: 6px; align-items: flex-start; }
  .memory li::before { content: "·"; color: var(--accent); font-weight: 700; }
  .memory .none { color: var(--muted); }
  .memory .none::before { content: none; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .ghost:hover { border-color: var(--accent); color: var(--fg); }
  .stack { display: grid; gap: 8px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: none; }
  #log { flex: 1; overflow-y: auto; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .msg { min-width: 0; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: 85%; white-space: pre-wrap; }
  .who { font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 4px; }
  .body p { margin: 0 0 10px; }
  .body p:last-child { margin-bottom: 0; }
  .body ul { margin: 0 0 10px; padding-left: 20px; }
  .body pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 13px/1.55 var(--font-mono); margin: 0 0 10px; }
  .body code { font-family: var(--font-mono); font-size: 0.88em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .body pre code { background: none; padding: 0; }
  .tool { display: inline-flex; gap: 6px; font: 12px var(--font-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; margin: 0 6px 8px 0; }
  .sources { margin-top: 10px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .sources a { color: var(--accent); text-decoration: none; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sources a:hover { text-decoration: underline; }
  .thinking { color: var(--muted); font-size: 14px; }
  .thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .err { color: var(--danger); font-size: 14px; margin-top: 6px; }

  .welcome { padding-top: 6vh; display: grid; gap: 14px; }
  .welcome h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; text-align: left; }
  .chip:hover { border-color: var(--accent); }

  .dl { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
  .dl b { display: block; font-weight: 500; }
  .dl span { display: block; font-size: 13px; color: var(--muted); }
  .dl a { color: var(--accent); font-weight: 500; overflow-wrap: anywhere; }
  .dl > div { min-width: 0; flex: 1 1 260px; }
  .keybox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .keybox h2 { font-size: 16px; margin: 0; }
  .keybox p { margin: 0; font-size: 13.5px; color: var(--muted); }
  .keybox a { color: var(--accent); }
  .keyrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .keyrow input { flex: 1; min-width: 0; font: 14px var(--font-mono); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

  form { padding-block: 10px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; }
  .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-sizing: border-box; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; resize: none; padding: 6px 8px; max-height: 180px; outline: none; }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 500; }
  .send:disabled { opacity: 0.45; cursor: default; }

  @media (max-width: 760px) {
    .rail { display: none; }
    .topbar { display: flex; gap: 8px; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .topbar select { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

  @media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; content: "..."; } }
</style>

<aside class="rail">
  <div class="brand">나만의 AI 비서<small>성격 · 기억 · 도구를 가진 Claude</small><span class="mode" id="mode">연결 확인 중</span></div>

    <div class="label">성격</div>

<main>

<script>
// 저장 버튼용: 스크립트가 화면을 바꾸기 전의 원본 문서
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;

const PERSONAS = {
  friend: { name: "나래", desc: "따뜻하고 유쾌한 대화 친구",
    prompt: "당신은 '나래'라는 이름의 따뜻하고 유쾌한 AI 친구입니다. 편한 존댓말로 이야기하고, 상대의 이야기에 진심으로 관심을 보입니다.",
    starters: ["오늘 좀 지쳤어", "요즘 화제인 뉴스 알려줘", "내 이름은 지우야, 기억해줘"] },
  tutor: { name: "공부 선생님", desc: "개념을 단계별로 설명하는 공부 도우미",
    prompt: "당신은 인내심 있는 과외 선생님입니다. 정답을 바로 주기보다 학생이 스스로 생각하도록 질문을 던지고, 개념을 쉬운 예시와 함께 단계별로 설명합니다. 설명 후에는 이해를 확인하는 짧은 문제를 하나 냅니다.",
    starters: ["광합성을 쉽게 설명해줘", "이차방정식 근의 공식은 왜 그렇게 생겼어?", "1234 × 5678 계산 과정 보여줘"] },
  coder: { name: "코딩 파트너", desc: "코드 작성·리뷰·디버깅 도우미",
    prompt: "당신은 숙련된 소프트웨어 엔지니어입니다. 정확하고 실행 가능한 코드를 제시하고, 왜 그렇게 하는지 간결하게 설명합니다. 코드는 마크다운 코드 블록으로 씁니다.",
    starters: ["파이썬으로 파일 단어 수 세는 코드", "for문과 while문 차이", "React 최신 버전에서 바뀐 점"] },
  support: { name: "고객 상담원", desc: "하늘마켓 고객응대 (예시 쇼핑몰)",
    prompt: "당신은 예시 온라인 쇼핑몰 '하늘마켓'의 친절한 상담원입니다. 정중한 존댓말을 쓰고, 환불·배송·교환 문의를 차분히 안내합니다. 정책을 모르는 경우 지어내지 말고 담당 부서 연결을 안내합니다. 기본 정책: 수령 후 7일 이내 무료 반품, 배송은 2~3일 소요.",
    starters: ["어제 주문했는데 언제 와요?", "사이즈가 안 맞아서 교환하고 싶어요", "환불은 얼마나 걸려요?"] },
};

const MODEL = "claude-opus-5-5";
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.129.0/+esm";
const KEY_STORE = "my-ai-api-key";
const GITHUB_URL = "https://github.com/advanceozeta-debug/ai/blob/ccr-94219d03-4xwo5o/artifact/my-ai.html";

const $ = (id) => document.getElementById(id);
// mode: "loading" | "claude"(claude.ai 안) | "api"(크롬 파일 + API 키) | "off"
const state = { mode: "loading", persona: "friend", turns: [], api: [], facts: [], busy: false, ctl: null, stream: null };
let sample = null, toolsOk = false, memStore = null, downloads = null, Anthropic = null, client = null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

function rules() {
  return `공통 규칙:
- 사용자가 쓰는 언어로 답하세요 (기본: 한국어).
- 사용자에 대해 오래 기억할 만한 사실(이름, 선호, 목표 등)을 알게 되면 remember 도구로 저장하세요.
- 계산은 추측하지 말고 calculator 도구를 쓰세요. 날짜·시각이 필요하면 current_time 도구를 쓰세요.
${state.mode === "api"
    ? "- 최신 정보·뉴스·날씨·가격처럼 바뀌는 정보는 web_search로 찾아보고, 어디서 찾았는지 짧게 밝히세요."
    : "- 지금은 웹 검색을 쓸 수 없어요. 최신 정보가 필요한 질문이면 그렇다고 말하고, 아는 범위에서 답하세요."}
- 모르는 것은 모른다고 말하세요. 답은 간결하게, 필요할 때만 목록이나 코드 블록을 쓰세요.`;
}
function instructions() {
  const p = PERSONAS[state.persona];
  return `${p.prompt}\n\n${rules()}\n\n지금까지 사용자에 대해 기억하는 내용:\n${state.facts.length ? state.facts.map((f) => "- " + f).join("\n") : "(없음)"}`;
}

// ---------- 기억 ----------
const LOCAL_KEY = "my-ai-memory";
function loadLocalFacts() { try { return JSON.parse(store.get(LOCAL_KEY)) || []; } catch { return []; } }
async function initCloudMemory() {
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const id = user ? await user.id() : null;
  if (!db || !id) { $("memNote").textContent = "기억은 이 브라우저에만 저장돼요."; return; }
  const ref = db.collection("data/users/" + id).doc("memory");
  try {
    const snap = await ref.get();
    const saved = snap.exists ? snap.data().facts : null;
    memStore = { async save(facts) { await ref.set({ facts }); } };
    if (Array.isArray(saved)) state.facts = saved.map(String);
    else if (state.facts.length) await memStore.save(state.facts);
    $("memNote").textContent = "대화 중에 알려준 내용을 AI가 저장해요. 나만 볼 수 있어요.";
    renderMemory();
  } catch { memStore = null; $("memNote").textContent = "기억은 이 브라우저에만 저장돼요."; }
}
async function saveMemory() {
  renderMemory();
  store.set(LOCAL_KEY, JSON.stringify(state.facts));
  if (memStore) { try { await memStore.save(state.facts); } catch {} }
}
function renderMemory() {
  const ul = $("memory");
  ul.replaceChildren();
  if (!state.facts.length) { const li = document.createElement("li"); li.className = "none"; li.textContent = "아직 없음"; ul.append(li); return; }
  for (const f of state.facts) { const li = document.createElement("li"); li.textContent = f; ul.append(li); }
}

// ---------- 도구 (두 모드 공통) ----------
function safeEval(expr) {
  const src = String(expr).replace(/\s+/g, "").replace(/\*\*/g, "^").replace(/×/g, "*").replace(/÷/g, "/");
  if (!/^[0-9+\-*/%^().a-z]*$/i.test(src)) throw new Error("숫자와 + - * / % ^ ( ) 그리고 sqrt, sin, cos, tan, log, pi, e 만 쓸 수 있어요");
  let i = 0;
  const FN = { sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos, tan: Math.tan, log: Math.log, abs: Math.abs };
  const peek = () => src[i];
  function primary() {
    if (peek() === "(") { i++; const v = expr0(); if (src[i++] !== ")") throw new Error("괄호가 맞지 않아요"); return v; }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(src.slice(i));
    if (m) { i += m[0].length; return parseFloat(m[0]); }
    const w = /^[a-z]+/i.exec(src.slice(i));
    if (w) {
      i += w[0].length; const name = w[0].toLowerCase();
      if (name === "pi") return Math.PI;
      if (name === "e") return Math.E;
      if (FN[name] && peek() === "(") return FN[name](primary());
      throw new Error("모르는 이름: " + name);
    }
    throw new Error("식을 읽을 수 없어요");
  }
  function unary() { if (peek() === "-") { i++; return -unary(); } if (peek() === "+") { i++; return unary(); } return power(); }
  function power() { const b = primary(); if (peek() === "^") { i++; const ex = unary(); if (Math.abs(ex) > 1000) throw new Error("지수가 너무 커요"); return b ** ex; } return b; }
  function term() { let v = unary(); while ("*/%".includes(peek() || "x")) { const op = src[i++]; const r = unary(); v = op === "*" ? v * r : op === "/" ? v / r : v % r; } return v; }
  function expr0() { let v = term(); while (peek() === "+" || peek() === "-") { const op = src[i++]; const r = term(); v = op === "+" ? v + r : v - r; } return v; }
  const v = expr0();
  if (i !== src.length) throw new Error("식을 끝까지 읽지 못했어요");
  return v;
}

let showTool = () => {};
const TOOLS = [
  { name: "calculator", description: "수식을 정확히 계산해 결과 숫자를 돌려줍니다. + - * / % ** 와 sqrt, sin, cos, tan, log, pi, e 지원.",
    inputSchema: { type: "object", properties: { expression: { type: "string", description: "예: (3+4)*2**3" } }, required: ["expression"] },
    execute: ({ expression }) => { showTool("calculator", String(expression)); return String(safeEval(expression)); } },
  { name: "current_time", description: "사용자 기기 기준 현재 날짜·시각·요일을 돌려줍니다.",
    inputSchema: { type: "object", properties: {} },
    execute: () => { showTool("current_time", ""); return new Date().toLocaleString("ko-KR", { dateStyle: "full", timeStyle: "short" }); } },
  { name: "remember", description: "사용자에 대해 다음 대화에서도 기억할 사실 하나를 저장합니다. 저장 결과를 돌려줍니다.",
    inputSchema: { type: "object", properties: { fact: { type: "string" } }, required: ["fact"] },
    execute: async ({ fact }) => {
      const f = String(fact || "").trim(); showTool("remember", f);
      if (!f) throw new Error("빈 내용");
      if (state.facts.includes(f)) return "이미 기억하고 있어요";
      state.facts.push(f); await saveMemory(); return "기억했습니다: " + f;
    } },
  { name: "forget", description: "키워드가 들어간 기억을 지웁니다. 사용자가 잊어달라고 할 때만 씁니다. 지운 개수를 돌려줍니다.",
    inputSchema: { type: "object", properties: { keyword: { type: "string" } }, required: ["keyword"] },
    execute: async ({ keyword }) => {
      const k = String(keyword || ""); showTool("forget", k);
      if (!k) throw new Error("빈 키워드");
      const before = state.facts.length; state.facts = state.facts.filter((f) => !f.includes(k));
      await saveMemory(); return `${before - state.facts.length}개를 지웠어요`;
    } },
];
const API_TOOLS = [
  { type: "web_search_20260209", name: "web_search", max_uses: 5 },
  ...TOOLS.map((t) => ({ name: t.name, description: t.description, input_schema: t.inputSchema })),
];

// ---------- 화면 ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(src) {
  const parts = src.split(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g);
  let html = "";
  parts.forEach((part, idx) => {
    if (idx % 2) { html += "<pre><code>" + esc(part.replace(/\n$/, "")) + "</code></pre>"; return; }
    for (const block of esc(part).split(/\n{2,}/)) {
      if (!block.trim()) continue;
      const inline = (t) => t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l))) html += "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*([-*]|\d+\.)\s/, "")) + "</li>").join("") + "</ul>";
      else html += "<p>" + inline(block).replace(/\n/g, "<br>") + "</p>";
    }
  });
  return html;
}
const scrollDown = () => { $("log").scrollTop = $("log").scrollHeight; };

function renderWelcome() {
  const p = PERSONAS[state.persona];
  const col = $("col");
  if (state.mode === "api" && !client) { renderKeyBox(); return; }
  const tools = state.mode === "api" ? "웹 검색, 계산, 시각 확인, 기억하기" : "계산, 시각 확인, 기억하기";
  col.innerHTML = `<div class="welcome"><h1>${esc(p.name)}에게 말을 걸어보세요</h1><p>${esc(p.desc)}. ${tools} 도구를 스스로 써요.</p><div class="chips"></div></div>`;
  const chips = col.querySelector(".chips");
  for (const s of p.starters) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = s;
    b.onclick = () => send(s); chips.append(b);
  }
  if (state.mode === "claude") {
    const dl = document.createElement("div"); dl.className = "dl";
    dl.innerHTML = `<div><b>크롬에서 웹 검색까지 쓰기</b><span>파일을 받아 크롬으로 열고, Anthropic API 키를 넣으면 웹 검색이 켜져요.</span></div>`;
    if (downloads) {
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "send"; btn.textContent = "파일 받기";
      btn.onclick = saveFile; dl.append(btn);
    }
    const alt = document.createElement("span");
    alt.innerHTML = `${downloads ? "안 받아지면" : "여기서 받기:"} <a href="${GITHUB_URL}" target="_blank" rel="noopener">GitHub에서 받기</a> (페이지 오른쪽 위 ⤓ 버튼)`;
    dl.querySelector("div").append(alt);
    col.querySelector(".welcome").append(dl);
  }
}
function renderKeyBox() {
  $("col").innerHTML = `<div class="keybox">
    <h2>Anthropic API 키를 넣어주세요</h2>
    <p>크롬에서 파일로 열면 내 API 키로 Claude와 직접 대화해요. 웹 검색도 쓸 수 있어요. 키는 <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>에서 만들 수 있고, 사용한 만큼 요금이 나가요.</p>
    <div class="keyrow"><input id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off" aria-label="API 키"><button class="send" id="keySave" type="button">저장</button></div>
    <p>키는 이 컴퓨터의 브라우저에만 저장되고 Anthropic 말고는 어디에도 보내지 않아요. 남과 같이 쓰는 컴퓨터라면 다 쓴 뒤 'API 키 바꾸기'에서 지워 주세요.</p>
  </div>`;
  $("keySave").onclick = () => {
    const k = $("keyInput").value.trim();
    if (!k.startsWith("sk-ant-")) { $("keyInput").setCustomValidity("sk-ant- 로 시작하는 키를 넣어주세요"); $("keyInput").reportValidity(); return; }
    store.set(KEY_STORE, k); connectApi(k);
  };
  $("keyInput").addEventListener("input", (e) => e.target.setCustomValidity(""));
  $("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("keySave").click(); });
  $("keyInput").focus();
}
function setPersona(key) {
  if (state.busy) return;
  state.persona = key; state.turns = []; state.api = [];
  document.querySelectorAll(".persona").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === key)));
  $("personaSelect").value = key;
  store.set("my-ai-persona", key);
  renderWelcome();
}
function ready() { return (state.mode === "claude" && sample) || (state.mode === "api" && client); }
function setBusy(b) {
  state.busy = b;
  $("send").textContent = b ? "멈추기" : "보내기";
  $("send").disabled = !b && !ready();
}
function setMode(mode, label, on) {
  state.mode = mode;
  $("mode").textContent = label; $("mode").classList.toggle("on", on);
  const api = mode === "api";
  $("changeKey").hidden = $("changeKeyMobile").hidden = !api;
}
function showBanner(msg) { $("banner").textContent = msg; $("banner").hidden = !msg; }
function addMsg(cls, html) {
  $("col").querySelector(".welcome, .keybox")?.remove();
  const el = document.createElement("div"); el.className = "msg " + cls; el.innerHTML = html;
  $("col").append(el); scrollDown(); return el;
}

// ---------- 보내기 ----------
async function send(text) {
  if (state.busy || !ready() || !text.trim()) return;
  const p = PERSONAS[state.persona];
  addMsg("user", esc(text));
  const bot = addMsg("bot", `<div class="who">${esc(p.name)}</div><div class="tools"></div><div class="body"><span class="thinking">생각하는 중</span></div>`);
  const ui = { body: bot.querySelector(".body"), tools: bot.querySelector(".tools"), bot };
  showTool = (name, arg) => {
    const t = document.createElement("span"); t.className = "tool"; t.textContent = `${name}${arg ? " · " + arg : ""}`;
    ui.tools.append(t); scrollDown();
  };
  state.ctl = new AbortController(); setBusy(true);
  try {
    if (state.mode === "claude") await sendViaClaude(text, ui);
    else await sendViaApi(text, ui);
  } finally {
    setBusy(false); state.ctl = null; state.stream = null; $("input").focus();
  }
}
const errLine = (ui, msg) => ui.body.insertAdjacentHTML("beforeend", `<div class="err">${esc(msg)}</div>`);

// claude.ai 안: 보는 사람의 Claude 계정으로
const SAMPLE_ERRORS = {
  not_granted: "Claude 사용이 허용되지 않았어요. 페이지를 새로고침하면 다시 물어봐요.",
  sampling_disabled: "이 계정에서는 Claude를 쓸 수 없어요.",
  rate_limited: "지금은 요청이 많아요. 잠시 뒤 다시 보내주세요.",
  session_expired: "로그인이 만료됐어요. 다시 로그인해 주세요.",
  refused: "이 요청에는 답할 수 없어요. 다르게 물어봐 주세요.",
  prompt_too_large: "대화가 너무 길어졌어요. '새 대화'를 눌러 주세요.",
  empty_completion: "답이 비어 있어요. 질문을 조금 바꿔 보세요.",
};
const HIDE = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
async function sendViaClaude(text, ui) {
  state.turns.push({ role: "user", content: text });
  const input = [{ role: "user", content: instructions() }, ...state.turns.slice(-30)];
  try {
    const opts = { signal: state.ctl.signal, cache: false, onText: ({ text: t }) => { ui.body.innerHTML = md(t); scrollDown(); } };
    if (toolsOk) { delete opts.cache; opts.tools = TOOLS; }
    const res = await sample(input, opts);
    state.turns.push({ role: "assistant", content: res.text });
    ui.body.innerHTML = md(res.text);
    if (res.truncated) errLine(ui, "답이 길어서 중간에 끊겼어요.");
  } catch (e) {
    const kept = e && e.code !== "refused" ? e.text : "";
    ui.body.innerHTML = kept ? md(kept) : "";
    if (kept) state.turns.push({ role: "assistant", content: kept });
    if (e?.code !== "cancelled") errLine(ui, SAMPLE_ERRORS[e?.code] || "연결이 끊겼어요. 다시 보내주세요.");
    if (HIDE.includes(e?.code)) { sample = null; showBanner(SAMPLE_ERRORS[e.code] || "이 화면에서는 Claude를 쓸 수 없어요."); }
  }
}

// 크롬 파일: 내 API 키로 Claude API 직접 호출 (웹 검색 포함)
async function sendViaApi(text, ui) {
  const start = state.api.length;
  state.api.push({ role: "user", content: text });
  let shown = "", round = "";
  const paint = () => { ui.body.innerHTML = md(shown + round) || '<span class="thinking">생각하는 중</span>'; scrollDown(); };
  const sources = new Map();
  try {
    for (let step = 0; step < 20; step++) {
      if (state.ctl.signal.aborted) throw new DOMException("stopped", "AbortError");
      round = "";
      const stream = client.beta.messages.stream({
        model: MODEL,
        max_tokens: 64000,
        system: instructions(),
        messages: state.api,
        tools: API_TOOLS,
        output_config: { effort: "medium" },
        // 안전 분류기가 거절하면 Anthropic 권장 모델로 자동 재시도
        betas: ["server-side-fallback-2026-07-01"],
        fallbacks: "default",
      });
      state.stream = stream;
      stream.on("text", (delta) => { round += delta; paint(); });
      stream.on("streamEvent", (ev) => {
        if (ev.type === "content_block_start" && ev.content_block.type === "server_tool_use") showTool("web_search", "찾는 중");
      });
      const msg = await stream.finalMessage();
      state.api.push({ role: "assistant", content: msg.content });
      shown += round ? round + "\n\n" : ""; round = "";

      for (const b of msg.content) {
        if (b.type === "server_tool_use" && b.input?.query) {
          const pending = [...ui.tools.children].find((c) => c.textContent === "web_search · 찾는 중");
          if (pending) pending.textContent = "web_search · " + b.input.query;
        }
        if (b.type === "web_search_tool_result" && Array.isArray(b.content)) {
          for (const r of b.content) if (r.url && sources.size < 6) sources.set(r.url, r.title || r.url);
        }
      }
      paint();

      if (msg.stop_reason === "refusal") { errLine(ui, "이 요청에는 답할 수 없어요. 다르게 물어봐 주세요."); break; }
      if (msg.stop_reason === "pause_turn") continue;
      if (msg.stop_reason !== "tool_use") {
        if (msg.stop_reason === "max_tokens") errLine(ui, "답이 길어서 중간에 끊겼어요.");
        break;
      }
      const results = [];
      for (const b of msg.content) {
        if (b.type !== "tool_use") continue;
        const tool = TOOLS.find((t) => t.name === b.name);
        try {
          if (!tool) throw new Error("알 수 없는 도구: " + b.name);
          const out = await tool.execute(b.input || {});
          results.push({ type: "tool_result", tool_use_id: b.id, content: String(out) });
        } catch (err) {
          results.push({ type: "tool_result", tool_use_id: b.id, content: "오류: " + err.message, is_error: true });
        }
      }
      state.api.push({ role: "user", content: results });
    }
    if (sources.size) {
      const box = document.createElement("div"); box.className = "sources";
      box.append("출처:");
      for (const [url, title] of sources) {
        const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = title; a.title = url; box.append(a);
      }
      ui.bot.append(box); scrollDown();
    }
  } catch (e) {
    // 이번 턴을 통째로 되돌려서 다음 질문이 깨끗하게 시작되게
    state.api.length = start;
    paint();
    if (state.ctl.signal.aborted || e?.name === "AbortError" || (Anthropic && e instanceof Anthropic.APIUserAbortError)) { errLine(ui, "멈췄어요."); return; }
    errLine(ui, apiErrorText(e));
    if (Anthropic && e instanceof Anthropic.AuthenticationError) { store.set(KEY_STORE, null); client = null; setTimeout(renderKeyBox, 1500); }
  }
}
function apiErrorText(e) {
  if (!Anthropic) return "연결에 실패했어요.";
  if (e instanceof Anthropic.AuthenticationError) return "API 키가 올바르지 않아요. 키를 다시 넣어주세요.";
  if (e instanceof Anthropic.PermissionDeniedError) return "이 API 키로는 이 기능을 쓸 수 없어요.";
  if (e instanceof Anthropic.RateLimitError) return "요청이 너무 많거나 크레딧이 부족해요. 잠시 뒤 다시 시도해 주세요.";
  if (e instanceof Anthropic.BadRequestError) return "요청 오류: " + (e.error?.error?.message || e.message);
  if (e instanceof Anthropic.APIConnectionError) return "인터넷 연결을 확인해 주세요.";
  if (e instanceof Anthropic.APIError) return `API 오류 (${e.status ?? "?"}): ${e.message}`;
  return "알 수 없는 오류: " + (e?.message || e);
}
async function connectApi(key) {
  try {
    if (!Anthropic) Anthropic = (await import(SDK_URL)).default;
  } catch {
    showBanner("Claude 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.");
    return;
  }
  client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
  showBanner("");
  setBusy(false);
  renderWelcome();
  $("input").focus();
}

// ---------- 시작 ----------
$("personas").innerHTML = Object.entries(PERSONAS).map(([k, p]) =>
  `<button type="button" class="persona" data-key="${k}" aria-pressed="false"><b>${esc(p.name)}</b><span>${esc(p.desc)}</span></button>`).join("");
$("personaSelect").innerHTML = Object.entries(PERSONAS).map(([k, p]) => `<option value="${k}">${esc(p.name)}</option>`).join("");
document.querySelectorAll(".persona").forEach((b) => (b.onclick = () => setPersona(b.dataset.key)));
$("personaSelect").onchange = (e) => setPersona(e.target.value);
$("reset").onclick = $("resetMobile").onclick = () => setPersona(state.persona);
$("changeKey").onclick = $("changeKeyMobile").onclick = () => { if (state.busy) return; store.set(KEY_STORE, null); client = null; setBusy(false); renderKeyBox(); };
async function saveFile() {
  if (!downloads) { showBanner("이 화면에서는 파일 저장이 안 돼요. 첫 화면의 GitHub 링크에서 받아주세요."); return; }
  try {
    const r = await downloads.save({ filename: "나만의-AI-비서.html", data: new Blob([PRISTINE], { type: "text/html" }) });
    if (r !== false) showBanner("");
  } catch (e) { if (e?.code !== "declined") showBanner("이 화면에서는 파일 저장이 안 돼요. 첫 화면의 GitHub 링크에서 받아주세요."); }
}
$("saveFile").onclick = $("saveFileMobile").onclick = saveFile;
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.busy) { state.ctl?.abort(); state.stream?.abort(); return; }
  const t = $("input").value.trim(); if (!t) return;
  $("input").value = ""; $("input").style.height = "auto"; send(t);
});
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });

state.facts = loadLocalFacts();
renderMemory();
const savedPersona = store.get("my-ai-persona");
state.persona = PERSONAS[savedPersona] ? savedPersona : "friend";
$("send").disabled = true;

(async () => {
  const inViewer = Boolean(window.claude?.use);
  if (inViewer) sample = await claude.use("sample");
  if (sample) {
    setMode("claude", "claude.ai 모드 · 웹 검색 꺼짐", true);
    $("memNote").textContent = "대화 중에 알려준 내용을 AI가 저장해요.";
    initCloudMemory();
    const limits = await sample.limits().catch(() => null);
    toolsOk = Boolean(limits?.tools);
    downloads = await claude.use("downloads");
    $("saveFile").hidden = $("saveFileMobile").hidden = !downloads;
    setPersona(state.persona); setBusy(false);
    return;
  }
  if (inViewer && location.protocol !== "file:") {
    // claude.ai 주소에서 바로 열린 경우: 여기서는 외부 API 호출이 막혀 있어요
    setMode("off", "사용 불가", false); setPersona(state.persona);
    showBanner("claude.ai에 로그인한 상태로 링크를 열거나, 파일로 저장해 크롬에서 열어주세요.");
    return;
  }
  setMode("api", "크롬 모드 · 웹 검색 켜짐", true);
  $("memNote").textContent = "기억은 이 컴퓨터의 브라우저에만 저장돼요.";
  setPersona(state.persona);
  const key = store.get(KEY_STORE);
  if (key) connectApi(key);
})();
</script>
