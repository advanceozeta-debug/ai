<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 AI 비서</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1f1f1d; --muted: #6b6a66;
    --border: #e4e2dc; --accent: #c96442; --accent-text: #ffffff;
    --user-bg: #ede9e1; --code-bg: #f1efea; --tool-bg: #f7f3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --panel: #262523; --text: #ecebe7; --muted: #a09e98;
      --border: #3a3936; --accent: #d97757; --accent-text: #1c1b19;
      --user-bg: #34322e; --code-bg: #1f1e1c; --tool-bg: #2e2b25;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
  }
  aside {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--panel); padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
  }
  aside h1 { font-size: 18px; margin: 0; }
  aside h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .persona {
    display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px;
    border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--text);
    cursor: pointer; font: inherit;
  }
  .persona small { display: block; color: var(--muted); font-size: 13px; }
  .persona.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  #memory { font-size: 14px; color: var(--muted); padding-left: 18px; margin: 0; }
  #memory li { margin-bottom: 4px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: none; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 20px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user-bg); padding: 10px 14px; border-radius: 14px; margin-left: auto; width: fit-content; max-width: 85%; white-space: pre-wrap; }
  .msg.bot .who { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .msg.bot p { margin: 0 0 10px; }
  .msg.error { color: #c0392b; }
  .tool { font-size: 13px; color: var(--muted); background: var(--tool-bg); border-radius: 8px; padding: 4px 10px; margin: 6px 0; display: inline-block; }
  pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; font-size: 0.9em; }
  pre code { background: none; padding: 0; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty .big { font-size: 40px; }
  form { padding: 12px 16px 20px; }
  .composer { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 8px; }
  textarea { flex: 1; border: none; resize: none; background: transparent; color: var(--text); font: inherit; padding: 6px 8px; max-height: 200px; outline: none; }
  button.send { background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: 0.5; cursor: default; }
  .reset { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { display: none; }
    header { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header select { flex: 1; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  }
</style>
</head>
<body>
<aside>
  <h1>🤖 나만의 AI 비서</h1>
  <section>
    <h2>성격 고르기</h2>
    <div id="personas"></div>
  </section>
  <section>
    <h2>기억하는 내용</h2>
    <ul id="memory"></ul>
  </section>
  <button class="reset" id="reset">대화 새로 시작</button>
</aside>
<main>
  <header>
    <select id="personaSelect" aria-label="성격"></select>
    <button class="reset" id="resetMobile">새 대화</button>
  </header>
  <div id="log"><div class="inner" id="inner"></div></div>
  <form id="form">
    <div class="inner composer">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요"></textarea>
      <button class="send" id="send">보내기</button>
    </div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sessionId = null, personaKey = null, botName = "", busy = false, personas = [];

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 아주 작은 마크다운 렌더러: 코드 블록, 인라인 코드, 굵게, 목록, 줄바꿈
function renderMarkdown(src) {
  const parts = src.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let html = "";
  for (let i = 0; i < parts.length; i += 3) {
    html += escapeHtml(parts[i]).split(/\n{2,}/).filter(Boolean).map((para) =>
      "<p>" + para
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>") + "</p>").join("");
    if (i + 2 < parts.length) html += "<pre><code>" + escapeHtml(parts[i + 2]) + "</code></pre>";
  }
  return html;
}

function scrollDown() { $("log").scrollTop = $("log").scrollHeight; }

function showEmpty() {
  const p = personas.find((x) => x.key === personaKey);
  $("inner").innerHTML = `<div class="empty"><div class="big">👋</div><p><strong>${escapeHtml(p.name)}</strong>에게 말을 걸어보세요<br><small>${escapeHtml(p.description)}</small></p></div>`;
}

async function startSession(key) {
  personaKey = key;
  const res = await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ persona: key }) });
  const data = await res.json();
  sessionId = data.session_id; botName = data.name;
  document.querySelectorAll(".persona").forEach((b) => b.classList.toggle("active", b.dataset.key === key));
  $("personaSelect").value = key;
  showEmpty();
  loadMemory();
}

async function loadMemory() {
  const { facts } = await (await fetch("/api/memory")).json();
  $("memory").innerHTML = facts.length ? facts.map((f) => `<li>${escapeHtml(f)}</li>`).join("") : "<li>아직 없음</li>";
}

function addMessage(cls, html) {
  $("inner").querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  $("inner").appendChild(div);
  scrollDown();
  return div;
}

async function send(text) {
  busy = true; $("send").disabled = true;
  addMessage("user", escapeHtml(text));
  const bot = addMessage("bot", `<div class="who">${escapeHtml(botName)}</div><div class="body cursor"></div>`);
  const body = bot.querySelector(".body");
  let answer = "", toolsHtml = "";
  const paint = () => { body.innerHTML = toolsHtml + renderMarkdown(answer); scrollDown(); };

  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId, message: text }) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") answer += ev.text;
        else if (ev.type === "tool") toolsHtml += `<div class="tool">🔧 ${escapeHtml(ev.name)} ${escapeHtml(JSON.stringify(ev.input))}</div>`;
        else if (ev.type === "error") { answer += (answer ? "\n\n" : "") + "⚠️ " + ev.message; bot.classList.add("error"); }
        if (ev.type === "tool" && (ev.name === "remember" || ev.name === "forget")) setTimeout(loadMemory, 300);
        paint();
      }
    }
  } catch (err) {
    answer += "⚠️ " + err.message; bot.classList.add("error"); paint();
  } finally {
    body.classList.remove("cursor");
    busy = false; $("send").disabled = false; $("input").focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = ""; $("input").style.height = "auto";
  send(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("reset").onclick = $("resetMobile").onclick = () => !busy && startSession(personaKey);
$("personaSelect").onchange = (e) => !busy && startSession(e.target.value);

(async () => {
  personas = await (await fetch("/api/personas")).json();
  $("personas").innerHTML = personas.map((p) =>
    `<button class="persona" data-key="${p.key}">${escapeHtml(p.name)}<small>${escapeHtml(p.description)}</small></button>`).join("");
  $("personaSelect").innerHTML = personas.map((p) => `<option value="${p.key}">${escapeHtml(p.name)}</option>`).join("");
  document.querySelectorAll(".persona").forEach((b) => b.onclick = () => !busy && startSession(b.dataset.key));
  startSession(personas[0].key);
  $("input").focus();
})();
</script>
</body>
</html>
