<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오미크론</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#1d6b62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오미크론">
<style>
  :root {
    --bg: #f3f5f4; --panel: #ffffff; --fg: #18211f; --muted: #5f6b68; --line: #dce2e0;
    --accent: #1d6b62; --accent-ink: #ffffff; --accent-soft: #e2efec; --user: #e6ebe9; --code: #eef2f1; --danger: #b3261e;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121716; --panel: #1a2120; --fg: #e5ebe9; --muted: #96a3a0; --line: #2b3533;
      --accent: #5bbfb0; --accent-ink: #0d1413; --accent-soft: #1f3330; --user: #243030; --code: #0f1413; --danger: #f2a49d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--font); display: flex; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  aside { width: 280px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); padding: 22px 18px;
    padding-left: max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
  .brand { font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 8px; }
  .personas { display: grid; gap: 6px; }
  .persona { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 11px; }
  .persona:hover { background: var(--accent-soft); }
  .persona b { display: block; font-weight: 600; }
  .persona span { display: block; font-size: 13px; color: var(--muted); }
  .persona[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  #memory { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  #memory li::before { content: "· "; color: var(--accent); font-weight: 700; }
  #memory .none { color: var(--muted); }
  #memory .none::before { content: none; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; color: var(--muted); }
  .ghost:hover { border-color: var(--accent); color: var(--fg); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: none; }
  #log { flex: 1; overflow-y: auto; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .msg { overflow-wrap: anywhere; min-width: 0; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 85%; white-space: pre-wrap; }
  .who { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .body p { margin: 0 0 10px; }
  .body p:last-child { margin: 0; }
  .body ul { margin: 0 0 10px; padding-left: 20px; }
  .msg.error .body { color: var(--danger); }
  .tool { font: 12px var(--mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; margin: 0 6px 8px 0; display: inline-block; }
  pre { background: var(--code); border: 1px solid var(--line); padding: 12px; border-radius: 8px; overflow-x: auto; font: 14px/1.5 var(--mono); }
  code { font-family: var(--mono); background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 0.9em; }
  pre code { background: none; padding: 0; }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .divider { text-align: center; font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); margin-top: 16vh; }
  .empty b { color: var(--fg); font-size: 22px; display: block; margin-bottom: 4px; }

  form#form { padding-block: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; min-width: 0; border: none; resize: none; background: transparent; color: var(--fg); font: inherit; padding: 6px 8px; max-height: 200px; outline: none; }
  .send { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px; padding: 9px 18px; font-weight: 600; }
  .send:disabled { opacity: 0.5; cursor: default; }

  #login { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 10;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #login form { width: min(360px, 100%); display: grid; gap: 14px; text-align: center; }
  #login img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto; }
  #login h1 { margin: 0; font-size: 24px; }
  #login input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  #loginErr { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 0; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { display: none; }
    header { display: flex; gap: 8px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
    header select { flex: 1; min-width: 0; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <img src="/icon-192.png" alt="">
    <h1>오미크론</h1>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">
    <button class="send" type="submit">들어가기</button>
    <p id="loginErr"></p>
  </form>
</div>
<aside>
  <div class="brand"><img src="/icon-192.png" alt="">오미크론</div>
  <section><div class="label">성격</div><div class="personas" id="personas"></div></section>
  <section><div class="label">기억하는 내용</div><ul id="memory"></ul></section>
  <button class="ghost" id="reset" type="button">새 대화</button>
</aside>
<main>
  <header>
    <select id="personaSelect" aria-label="성격"></select>
    <button class="ghost" id="resetMobile" type="button">새 대화</button>
  </header>
  <div id="log"><div class="col" id="col"></div></div>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요" aria-label="메시지"></textarea>
      <button class="send" id="send">보내기</button>
    </div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sessionId = null, personaKey = null, botName = "", busy = false, personas = [];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(src) {
  const parts = src.split(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2) { html += "<pre><code>" + esc(part.replace(/\n$/, "")) + "</code></pre>"; return; }
    for (const block of esc(part).split(/\n{2,}/)) {
      if (!block.trim()) continue;
      const inline = (t) => t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l))) html += "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*([-*]|\d+\.)\s/, "")) + "</li>").join("") + "</ul>";
      else html += "<p>" + inline(block).replace(/\n/g, "<br>") + "</p>";
    }
  });
  return html;
}
const scrollDown = () => { $("log").scrollTop = $("log").scrollHeight; };

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (res.status === 401 && path !== "/api/login") { showLogin(); throw new Error("로그인이 필요해요."); }
  return res;
}

// ---------- 로그인 ----------
function showLogin(msg = "") { $("login").hidden = false; $("loginErr").textContent = msg; $("password").focus(); }
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginForm").querySelector("button");
  btn.disabled = true;
  $("loginErr").textContent = "확인하는 중...";
  try {
    // 무료 서버는 잠들었다 깨는 데 1분쯤 걸려요. 그보다 오래 걸리면 다시 누르라고 안내합니다.
    const res = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value }), signal: AbortSignal.timeout(90000),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      $("loginErr").textContent = data.detail || (res.status >= 500 ? "서버가 준비 중이에요. 잠시 후 다시 눌러주세요." : "들어갈 수 없어요.");
      return;
    }
    $("login").hidden = true; $("password").value = ""; $("loginErr").textContent = "";
    boot();
  } catch {
    $("loginErr").textContent = "서버가 응답하지 않아요. 깨어나는 중일 수 있으니 잠시 후 다시 눌러주세요.";
  } finally {
    btn.disabled = false;
  }
});

// ---------- 대화 ----------
function addMessage(cls, html) {
  $("col").querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls; div.innerHTML = html;
  $("col").appendChild(div); scrollDown();
  return div;
}
function showEmpty() {
  const p = personas.find((x) => x.key === personaKey);
  $("col").innerHTML = `<div class="empty"><b>${esc(p.name)}</b>${esc(p.description)}<br>무엇이든 말을 걸어보세요.</div>`;
}
async function startSession(key, resume = true) {
  personaKey = key;
  const res = await api("/api/session", { persona: key, resume });
  const data = await res.json();
  sessionId = data.session_id; botName = data.name;
  document.querySelectorAll(".persona").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === key)));
  $("personaSelect").value = key;
  try { localStorage.setItem("omicron-persona", key); } catch {}
  if (!data.history.length) showEmpty();
  else {
    $("col").innerHTML = "";
    for (const m of data.history) {
      if (m.role === "user") addMessage("user", esc(m.text));
      else addMessage("bot", `<div class="who">${esc(botName)}</div><div class="body">${md(m.text)}</div>`);
    }
    addMessage("divider", "지난 대화에서 이어서");
  }
  loadMemory();
}
async function loadMemory() {
  const { facts } = await (await api("/api/memory")).json();
  $("memory").innerHTML = facts.length ? facts.map((f) => `<li>${esc(f)}</li>`).join("") : '<li class="none">아직 없음</li>';
}
async function send(text, retried = false) {
  busy = true; $("send").disabled = true;
  if (!retried) addMessage("user", esc(text));
  const bot = addMessage("bot", `<div class="who">${esc(botName)}</div><div class="body cursor"></div>`);
  const body = bot.querySelector(".body");
  let answer = "", tools = "";
  const paint = () => { body.innerHTML = tools + md(answer); scrollDown(); };
  try {
    const res = await api("/api/chat", { session_id: sessionId, message: text });
    if (res.status === 404 && !retried) {
      // 서버가 잠들었다 깨어나면 세션이 사라져요 → 저장된 대화로 다시 이어서 보내기
      bot.remove(); busy = false;
      const keep = $("col").innerHTML;
      await startSession(personaKey, true);
      $("col").innerHTML = keep;
      return send(text, true);
    }
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n"); buffer = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") answer += ev.text;
        else if (ev.type === "tool") tools += `<span class="tool">${esc(ev.name)} ${esc(JSON.stringify(ev.input))}</span>`;
        else if (ev.type === "error") { answer += (answer ? "\n\n" : "") + "⚠️ " + ev.message; bot.classList.add("error"); }
        if (ev.type === "tool" && (ev.name === "remember" || ev.name === "forget")) setTimeout(loadMemory, 500);
        paint();
      }
    }
  } catch (err) {
    answer += "⚠️ " + err.message; bot.classList.add("error"); paint();
  } finally {
    body.classList.remove("cursor");
    busy = false; $("send").disabled = false; $("input").focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy || !sessionId) return;
  $("input").value = ""; $("input").style.height = "auto";
  send(text);
});
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("reset").onclick = $("resetMobile").onclick = () => !busy && startSession(personaKey, false);
$("personaSelect").onchange = (e) => !busy && startSession(e.target.value);

async function boot() {
  personas = await (await api("/api/personas")).json();
  $("personas").innerHTML = personas.map((p) => `<button type="button" class="persona" data-key="${p.key}"><b>${esc(p.name)}</b><span>${esc(p.description)}</span></button>`).join("");
  $("personaSelect").innerHTML = personas.map((p) => `<option value="${p.key}">${esc(p.name)}</option>`).join("");
  document.querySelectorAll(".persona").forEach((b) => (b.onclick = () => !busy && startSession(b.dataset.key)));
  let saved = null; try { saved = localStorage.getItem("omicron-persona"); } catch {}
  await startSession(personas.some((p) => p.key === saved) ? saved : personas[0].key);
  $("input").focus();
}
(async () => {
  const auth = await (await fetch("/api/auth")).json();
  if (auth.locked) showLogin("서버에 APP_PASSWORD 가 아직 설정되지 않았어요.");
  else if (!auth.ok) showLogin();
  else boot();
})();
</script>
</body>
</html>
