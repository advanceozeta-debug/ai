<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마검사 동작 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=DotGothic16&display=swap">
<style>
/* 동작별 한 줄: 왼쪽 재생 창, 오른쪽 프레임 전부. 정수 배율 ×3, 보간 끔 */
:root { --deep: #08111c; --night: #0d1a29; --panel: #14233a; --line: #2b3d5c; --silver: #f0e9f7; --lilac: #a8a1d2; --violet: #b98cfa; --gold: #e4b385;
  --display: "Gowun Batang", serif; --body: "IBM Plex Sans KR", system-ui, sans-serif; --pixel: "DotGothic16", monospace; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--deep); color: var(--silver); font-family: var(--body); }
main { max-width: 1180px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 14px; }
h1 { font-family: var(--display); margin: 0; font-size: 26px; }
.sub { font-family: var(--pixel); color: var(--lilac); font-size: 13px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 18px; align-items: center; }
.ctrl button, .ctrl a { font: 600 13px var(--body); color: var(--lilac); background: transparent; border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; text-decoration: none; }
.ctrl button.on { background: var(--gold); color: var(--deep); border-color: var(--gold); }
section { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; padding-block: 14px; border-top: 1px solid var(--line); }
section > div { min-width: 0; }
h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
h2 small { font-family: var(--pixel); color: var(--lilac); font-weight: 400; margin-left: 6px; }
.strip { overflow-x: auto; display: flex; gap: 6px; padding-bottom: 4px; }
.cell { display: grid; gap: 2px; justify-items: center; font-family: var(--pixel); font-size: 12px; color: var(--lilac); }
canvas { image-rendering: pixelated; display: block; background: var(--night); }
.note { font-size: 12px; color: var(--gold); margin-top: 6px; max-width: 70ch; }
@media (max-width: 640px) { section { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>은월의 마검사 · 동작 미리보기</h1>
    <span class="sub">칸 64×96 · 기준점 (32, 92) · ×3 정수 배율</span>
  </header>
  <div class="ctrl">
    <button id="flip" type="button">왼쪽 보기 (좌우 반전)</button>
    <button id="guide" type="button" class="on">기준점·바닥선</button>
    <button id="bgBtn" type="button">투명 확인 배경</button>
    <button id="slow" type="button">느리게 ×0.25</button>
    <a href="index.html">게임으로</a>
  </div>
  <div id="list"></div>
</main>
<script src="config.js"></script>
<script>
(async () => {
  const C = window.MAGEBLADE_CONFIG, Z = 3;
  const meta = await fetch("assets/mageblade/mageblade_sheet.json").then(r => r.json());
  const fx = await fetch("assets/mageblade/effects.json").then(r => r.json());
  const img = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = "assets/mageblade/" + meta.image; });
  const fxImg = {};
  for (const [k, v] of Object.entries(fx.effects)) fxImg[k] = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = "assets/mageblade/" + v.image; });
  const NAMES = { idle: "대기", run: "달리기", attack: "공격", skill: "스킬 시전", hit: "피격", down: "쓰러짐" };
  const FXN = { projectile: "투사체", field: "장판", explosion: "폭발" };
  let flip = false, guide = true, checker = false, speed = 1;
  const players = [];

  function paintBg(ctx, w, h) {
    if (!checker) { ctx.fillStyle = "#0d1a29"; ctx.fillRect(0, 0, w, h); return; }
    for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 8) { ctx.fillStyle = ((x + y) / 8) % 2 ? "#c83cc8" : "#78e678"; ctx.fillRect(x, y, 8, 8); }
  }
  function drawCell(ctx, src, sx, sy, sw, sh, ax, ay) {
    const w = sw * Z, h = sh * Z;
    ctx.imageSmoothingEnabled = false;
    paintBg(ctx, w, h);
    ctx.save();
    if (flip) { ctx.translate(ax * Z * 2, 0); ctx.scale(-1, 1); }      // 기준점 기준 좌우 반전
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    ctx.restore();
    if (guide) {
      ctx.fillStyle = "rgba(228,179,133,.55)"; ctx.fillRect(0, ay * Z, w, 1);
      ctx.fillStyle = "#ff4d4d"; ctx.fillRect(ax * Z - 4, ay * Z, 9, 1); ctx.fillRect(ax * Z, ay * Z - 4, 1, 9);
    }
  }
  function mk(w, h) { const c = document.createElement("canvas"); c.width = w * Z; c.height = h * Z; return c; }

  const list = document.getElementById("list");
  for (const [name, a] of Object.entries(meta.animations)) {
    const over = (C.animations[name] || {}).frameMs;
    const ms = over === undefined ? a.frameMs : Array.isArray(over) ? over : a.frames.map(() => over);
    const sec = document.createElement("section");
    const left = document.createElement("div"), right = document.createElement("div");
    const play = mk(64, 96); left.appendChild(play);
    const rule = a.holdLast ? "재생 후 마지막 유지" : a.loop ? "반복" : "한 번";
    right.innerHTML = `<h2>${NAMES[name]} <small>${name} · ${a.frames.length}프레임 · ${rule} · ${ms.join("/")}ms</small></h2>`;
    const strip = document.createElement("div"); strip.className = "strip";
    const cells = a.frames.map((f, i) => {
      const cell = document.createElement("div"); cell.className = "cell";
      const c = mk(64, 96); cell.appendChild(c);
      const lab = document.createElement("span"); lab.textContent = i + 1; cell.appendChild(lab);
      strip.appendChild(cell); return c;
    });
    right.appendChild(strip);
    if (a.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = "보정: " + a.note; right.appendChild(n); }
    sec.append(left, right); list.appendChild(sec);
    players.push({ kind: "char", a, ms, play, cells, i: 0, t: 0, wait: 0 });
  }
  for (const [name, e] of Object.entries(fx.effects)) {
    const sec = document.createElement("section");
    const left = document.createElement("div"), right = document.createElement("div");
    const play = mk(e.frameW, e.frameH); left.appendChild(play);
    right.innerHTML = `<h2>이펙트 · ${FXN[name]} <small>${name} · ${e.frames}프레임 · ${e.frameMs}ms · ${e.loop ? "반복" : "한 번"} · ${e.frameW}×${e.frameH}</small></h2>`;
    const strip = document.createElement("div"); strip.className = "strip";
    const cells = Array.from({ length: e.frames }, (_, i) => { const cell = document.createElement("div"); cell.className = "cell"; const c = mk(e.frameW, e.frameH); cell.appendChild(c); const l = document.createElement("span"); l.textContent = i + 1; cell.appendChild(l); strip.appendChild(cell); return c; });
    right.appendChild(strip);
    const n = document.createElement("div"); n.className = "note"; n.textContent = "캐릭터와 분리된 별도 레이어 · " + e.note; right.appendChild(n);
    sec.append(left, right); list.appendChild(sec);
    players.push({ kind: "fx", name, e, ms: Array(e.frames).fill(e.frameMs), play, cells, i: 0, t: 0, wait: 0 });
  }

  function paint(p, c, i) {
    const ctx = c.getContext("2d");
    if (p.kind === "char") { const f = p.a.frames[i]; drawCell(ctx, img, f.x, f.y, f.w, f.h, 32, 92); }
    else { const e = p.e; drawCell(ctx, fxImg[p.name], i * e.frameW, 0, e.frameW, e.frameH, e.anchor[0], e.anchor[1]); }
  }
  function repaintStrips() { for (const p of players) p.cells.forEach((c, i) => paint(p, c, i)); }
  repaintStrips();

  let last = performance.now();
  function tick(t) {
    const dt = (t - last) * speed; last = t;
    for (const p of players) {
      const n = p.ms.length, loop = p.kind === "char" ? p.a.loop : p.e.loop, hold = p.kind === "char" && p.a.holdLast;
      if (p.wait > 0) { p.wait -= dt; if (p.wait <= 0) { p.i = 0; p.t = 0; } }
      else {
        p.t += dt;
        while (p.t >= p.ms[p.i]) {
          p.t -= p.ms[p.i];
          if (p.i < n - 1) p.i++;
          else if (loop) p.i = 0;
          else { p.wait = hold ? 1400 : 600; p.t = 0; break; }     // 한 번 재생: 잠깐 멈췄다가 다시 보여 줌
        }
      }
      paint(p, p.play, p.i);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  const tog = (id, fn) => document.getElementById(id).addEventListener("click", e => { fn(); e.currentTarget.classList.toggle("on"); repaintStrips(); });
  tog("flip", () => flip = !flip); tog("guide", () => guide = !guide); tog("bgBtn", () => checker = !checker); tog("slow", () => speed = speed === 1 ? 0.25 : 1);
})();
</script>
</body>
</html>
