<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오미크론</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* 레이아웃: 한 화면짜리 대화 앱 — 위 이름표, 가운데 대화, 아래 입력줄 */
:root {
  --bg: #eef0f5; --surface: #ffffff; --fg: #1c2133; --muted: #6a7088;
  --accent: #34407a; --accent-fg: #f4f5fb; --line: #d9dce6; --ok: #2f9461;
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12151f; --surface: #1d2130; --fg: #e6e8f0; --muted: #959bb3;
  --accent: #8e9ce6; --accent-fg: #12151f; --line: #2c3144; --ok: #4cc286; color-scheme: dark } }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; }
.app { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px); }
header { padding-block: 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 28px; margin: 0; letter-spacing: 0.02em; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ready .dot { background: var(--ok); }
#newchat { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }

.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

#log { flex: 1; overflow-y: auto; padding-block: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 82%; line-height: 1.6; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
.who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .typing::after { animation: none; } .bar > i { transition: none; } }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 10px; scrollbar-width: none; }
.chips button { flex: none; font: inherit; font-size: 14px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chips button:hover { border-color: var(--accent); }

form { display: flex; gap: 8px; padding-block: 0 16px; }
#q { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
#send { font: inherit; font-weight: 500; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer; }
#send:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="name">오미크론</h1>
    <span class="meta" id="meta">두뇌 불러오는 중</span>
    <span class="right">
      <button type="button" id="newchat">새 대화</button>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">준비 중</span></span>
    </span>
  </header>
  <div class="bar" id="bar"><i id="barFill"></i></div>
  <div id="log" aria-live="polite">
    <div class="msg bot"><span class="who">오미크론</span>안녕하세요! 저는 처음부터 직접 만들어진 AI예요. 아무 말이나 걸어 주세요.</div>
  </div>
  <div class="chips" id="chips">
    <button type="button">너 누구야</button>
    <button type="button">오늘 너무 피곤해</button>
    <button type="button">주말에 뭐 할까</button>
    <button type="button">시험 망쳤어</button>
    <button type="button">배고파</button>
    <button type="button">잘 자</button>
  </div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="오미크론에게 말 걸기" aria-label="메시지">
    <button id="send" disabled>보내기</button>
  </form>
</div>

<script src="web/brain_engine.js"></script>
<script>
const $ = id => document.getElementById(id);
let chat = null, busy = false;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (cls === "bot") { const w = document.createElement("span"); w.className = "who"; w.textContent = chat ? chat.name : "오미크론"; d.appendChild(w); }
  const t = document.createElement("span"); t.textContent = text; d.appendChild(t);
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return t;
}

async function ask(q) {
  q = q.trim(); if (!q || busy || !chat) return;
  busy = true; $("send").disabled = true; $("q").value = "";
  add("me", q);
  const t = add("bot", ""); t.classList.add("typing");
  let ans = "";
  try {
    for await (const s of chat.reply(q)) { ans = s.trimStart(); t.textContent = ans; $("log").scrollTop = $("log").scrollHeight; }
  } catch (e) { ans = "계산 중에 문제가 생겼어요. 새로고침해 주세요."; }
  t.classList.remove("typing");
  if (!ans) t.textContent = "…";
  busy = false; $("send").disabled = false; $("q").focus();
}

async function fetchWithProgress(url, onP) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + " 를 찾을 수 없어요 (" + r.status + ")");
  const total = +r.headers.get("content-length") || 0;
  if (!r.body || !total) return r.arrayBuffer();
  const reader = r.body.getReader(), parts = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; onP(got / total); }
  const out = new Uint8Array(got); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out.buffer;
}

async function boot() {
  try {
    const [tokJson, buf] = await Promise.all([
      fetch("brain/tokenizer.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("사전 파일이 없어요"); return r.json(); }),
      fetchWithProgress("brain/model.bin", p => {
        $("barFill").style.width = Math.round(p * 100) + "%";
        $("statusText").textContent = "두뇌 받는 중 " + Math.round(p * 100) + "%";
      }),
    ]);
    $("statusText").textContent = "두뇌 펼치는 중";
    await new Promise(r => setTimeout(r, 30));
    const brain = OmicronBrain.parseBrain(buf);
    chat = OmicronBrain.createChat(brain, tokJson);
    const c = brain.config;
    let n = 0; for (const t of Object.values(brain.header.tensors)) n += t.shape.reduce((a, b) => a * b, 1);
    const unit = tokJson.type === "bpe" ? "단어 조각" : "글자";
    $("name").textContent = chat.name; document.title = chat.name;
    $("meta").textContent = `두뇌 숫자 ${n.toLocaleString()}개 · ${unit} ${tokJson.vocab.length.toLocaleString()}개 · ${c.n_layer}층 · 이 기기에서 계산`;
    $("bar").hidden = true;
    $("status").classList.add("ready"); $("statusText").textContent = "대화 가능";
    $("send").disabled = false;
  } catch (e) {
    $("statusText").textContent = "두뇌를 불러오지 못했어요";
    $("meta").textContent = String(e.message || e);
  }
}

$("f").addEventListener("submit", e => { e.preventDefault(); ask($("q").value); });
$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
$("newchat").addEventListener("click", () => {
  if (busy || !chat) return;
  chat.reset();
  $("log").innerHTML = "";
  add("bot", "새 대화를 시작할게요. 무슨 이야기 할까요?");
});
boot();
</script>
</body>
</html>
